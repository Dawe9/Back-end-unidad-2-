<!doctype html>
<html lang="es">
<head>
    <!-- Plantilla comun: todas las paginas heredan esta estructura. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cruzattour{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f4ee; color: #20231f; }
        .hero { background: linear-gradient(120deg, #14281d, #2f6042); color: white; }
        .product-card { border: 0; border-radius: 0.75rem; transition: transform .2s, box-shadow .2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 .75rem 1.5rem rgba(20, 40, 29, .12) !important; }
        .product-mark { background: #dce8d8; color: #2f6042; min-height: 140px; display: grid; place-items: center; font-size: 3rem; }
        .table thead th { white-space: nowrap; }
    </style>
</head>
<body>
    <!-- La barra permite navegar sin escribir manualmente las URLs. -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Cruzattour</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/products/">Catalogo</a>
                <a class="nav-link" href="/cart/">Carrito <span class="badge text-bg-success" id="cart-count">0</span></a>
                <a class="nav-link" href="/login/" id="login-link">Ingresar</a>
                <span class="nav-link text-success d-none" id="session-status">Sesion activa</span>
                <button class="btn btn-sm btn-outline-light d-none" id="logout-button" type="button">Salir</button>
            </div>
        </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function refreshCartCount() {
        const cart = JSON.parse(localStorage.getItem('nexo-cart') || '[]');
        const count = cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        const cartCount = document.querySelector('#cart-count');
        if (cartCount) cartCount.textContent = count;
    }

    refreshCartCount();
    window.addEventListener('storage', event => {
        if (event.key === 'nexo-cart') refreshCartCount();
    });

    const accessToken = localStorage.getItem('nexo-access-token');
    const loginLink = document.querySelector('#login-link');
    const sessionStatus = document.querySelector('#session-status');
    const logoutButton = document.querySelector('#logout-button');
    if (accessToken) {
        loginLink.classList.add('d-none');
        sessionStatus.classList.remove('d-none');
        logoutButton.classList.remove('d-none');
    }
    logoutButton.addEventListener('click', () => {
        localStorage.removeItem('nexo-access-token');
        localStorage.removeItem('nexo-refresh-token');
        window.location.href = '/';
    });
    </script>
</body>
</html>
