{% extends 'academic/base.html' %}
{% block title %}Reservas | Cruzattour{% endblock %}
{% block content %}
<section class="hero py-5 mb-4">
    <div class="container">
        <p class="text-uppercase small mb-2">Tu seleccion</p>
        <h1 class="display-6 fw-bold">Tus reservas</h1>
        <p class="lead mb-0">Revisa tus tours antes de confirmar.</p>
    </div>
</section>
<div class="container pb-5">
    <div class="row g-4">
        <div class="col-lg-7"><div id="cart-items" class="bg-white rounded shadow-sm p-4"></div></div>
        <div class="col-lg-5">
            <form id="checkout-form" class="bg-white rounded shadow-sm p-4">
                <h2 class="h4">Datos del viajero</h2>
                <label class="form-label mt-3" for="customer-name">Nombre</label>
                <input class="form-control" id="customer-name" required>
                <label class="form-label mt-3" for="customer-email">Correo electronico</label>
                <input class="form-control" id="customer-email" type="email" required>
                <hr>
                <div class="d-flex justify-content-between fs-5 mb-3"><span>Total</span><strong id="cart-total">$0</strong></div>
                <button class="btn btn-success w-100" type="submit">Confirmar compra</button>
                <div id="checkout-status" class="mt-3" role="status"></div>
            </form>
        </div>
    </div>
</div>
<script>
const money = value => `$${Number(value).toLocaleString('es-CL')}`;
let cart = JSON.parse(localStorage.getItem('nexo-cart') || '[]');

async function syncCartWithServer() {
    const token = localStorage.getItem('nexo-access-token');
    if (!token) return;
    try {
        const response = await fetch('/api/cart/', { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) return;
        const payload = await response.json();
        if (payload.tenant) {
            document.querySelectorAll('[data-tenant-name]').forEach(element => {
                element.textContent = payload.display_name || payload.tenant;
            });
            localStorage.setItem('nexo-tenant', payload.tenant);
            document.documentElement.style.setProperty('--tenant-color', payload.primary_color || '#2f6042');
        }
        if (Array.isArray(payload.cart) && payload.cart.length) {
            cart = payload.cart;
            localStorage.setItem('nexo-cart', JSON.stringify(cart));
        }
    } catch (error) {
        console.warn('No se pudo sincronizar el carrito del servidor:', error);
    }
}

async function saveCart() {
    localStorage.setItem('nexo-cart', JSON.stringify(cart));
    const token = localStorage.getItem('nexo-access-token');
    if (token) {
        await fetch('/api/cart/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ cart })
        });
    }
    renderCart();
}

function renderCart() {
    const target = document.querySelector('#cart-items');
    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    document.querySelector('#cart-total').textContent = money(total);
    document.querySelector('#cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    target.innerHTML = cart.length ? cart.map((item, index) => `
        <div class="d-flex justify-content-between align-items-center border-bottom py-3">
            <div><h3 class="h6 mb-1">${item.name}</h3><small class="text-secondary">${money(item.price)} cada uno</small></div>
            <div class="d-flex align-items-center gap-2"><input class="form-control" style="width: 70px" type="number" min="1" value="${item.quantity}" onchange="changeQuantity(${index}, this.value)"><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})">Quitar</button></div>
        </div>`).join('') : '<p class="text-secondary mb-0">Tu carrito esta vacio. <a href="/products/">Explora el catalogo.</a></p>';
    document.querySelector('#checkout-form button').disabled = !cart.length;
}

function changeQuantity(index, quantity) { cart[index].quantity = Math.max(1, Number(quantity)); saveCart(); }
function removeItem(index) { cart.splice(index, 1); saveCart(); }

document.querySelector('#checkout-form').addEventListener('submit', async event => {
    event.preventDefault();
    const status = document.querySelector('#checkout-status');
    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    const token = localStorage.getItem('nexo-access-token');
    const tenant = localStorage.getItem('nexo-tenant') || document.querySelector('#customer-name').value || 'default';
    if (!token) {
        status.className = 'text-danger';
        status.textContent = 'Debes iniciar sesion para confirmar la compra.';
        window.location.href = '/login/';
        return;
    }
    const response = await fetch('/api/orders/', {method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`}, body: JSON.stringify({
        tenant,
        customer_name: document.querySelector('#customer-name').value,
        customer_email: document.querySelector('#customer-email').value,
        items: cart,
        total
    })});
    if (!response.ok) { status.className = 'text-danger'; status.textContent = 'No se pudo registrar la compra.'; return; }
    const order = await response.json();
    cart = [];
    localStorage.setItem('nexo-cart', JSON.stringify(cart));
    if (token) {
        await fetch('/api/cart/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ cart: [] })
        });
    }
    renderCart();
    status.className = 'text-success';
    status.textContent = `Compra confirmada. Numero de pedido: #${order.id}`;
    event.target.reset();
});

syncCartWithServer().finally(() => renderCart());
</script>
{% endblock %}
